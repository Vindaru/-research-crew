# Runs on every push and pull request. Free: no API keys, no LLM calls.
name: ci
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q   # live tests skip themselves: no API keys here

  eval-gate:
    # The quality gate: run the golden set through the offline crew and FAIL the check if quality drops.
    # Branch protection on main can require this check, so a PR that weakens the critic can't be merged.
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Golden set (offline) with quality gate
        run: >
          python -m evals.run_evals --fake
          --min-pass-rate 0.9 --min-faithfulness 1.0
          --summary "$GITHUB_STEP_SUMMARY" --results eval-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-offline
          path: eval-results.json
